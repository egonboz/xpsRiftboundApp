[[redirects]]
  from = "/api/*"
  to = "https://api.cloudflare.riftbound.uvsgames.com/hydraproxy/api/v2/:splat"
  status = 200

[[redirects]]
  from = "/pairings-api/*"
  to = "https://eloshowdown.com/riftbound/api/tracker/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
